name: cinnamonmarketplace
description: A complete marketplace app for Sri Lankan cinnamon industry
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4

  flutter_local_notifications: ^21.0.0

  # icons
  font_awesome_flutter: ^11.0.0

  # Image Upload
  cloudinary_api: ^1.1.1
  cloudinary_url_gen: ^1.8.0

  # Image optimization
  flutter_image_compress: ^2.1.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # AI/ML
  tflite_flutter: ^0.12.1
  image: ^4.1.3

  # UI Components
  cached_network_image: ^3.3.1
  image_picker: ^1.2.1
  google_fonts: ^6.2.1
  animations: ^2.0.11
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  uuid: ^4.3.3
  url_launcher: ^6.2.4
  syncfusion_flutter_charts: ^32.1.22
  flutter_dotenv: ^5.1.0
  fluttertoast: ^8.2.4
  dartz: ^0.10.1
  photo_view: ^0.15.0

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_cancellable_tile_provider: ^3.0.0
  geolocator: ^11.0.0
  geocoding: ^2.1.1

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.2

  # For model updates
  http: ^1.2.0
  crypto: ^3.0.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_foreground: "assets/images/icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Integration testing
  integration_test:
    sdk: flutter
  patrol: ^4.5.0

  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  bloc_test: ^9.1.0
  mocktail: ^1.0.0

flutter:

  uses-material-design: true
  generate: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    - .env
    - assets/images/
    - assets/models/