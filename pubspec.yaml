name: cinnamon_marketplace_app
description: A complete marketplace app for Sri Lankan cinnamon industry
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4

  # icons
  font_awesome_flutter: ^10.12.0

  # Image Upload
  cloudinary_api: ^1.1.1
  cloudinary_url_gen: ^1.8.0

  # Image optimization
  flutter_image_compress: ^2.1.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # AI/ML
  tflite_flutter: ^0.12.1
  image: ^4.1.3
  camera: ^0.10.5

  # UI Components
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  fl_chart: ^0.66.0
  google_fonts: ^6.2.1
  animations: ^2.0.11
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  uuid: ^4.3.3
  url_launcher: ^6.2.4
  syncfusion_flutter_charts: ^32.1.22
  flutter_dotenv: ^5.1.0
  fluttertoast: ^8.2.4
  dartz: ^0.10.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_cancellable_tile_provider: ^3.0.0
  geolocator: ^11.0.0
  geocoding: ^2.1.1

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.2

  # For model updates
  http: ^1.2.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  flutter_lints: ^3.0.1

flutter:

  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/
    - assets/models/
    - assets/l10n/